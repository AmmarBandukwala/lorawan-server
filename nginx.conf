server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    # A device model carries a vendor payload formatter of up to 64 KiB, and the
    # api service allows 68 KiB for the surrounding JSON. A smaller limit here
    # would reject a legitimate formatter with a 413 from the proxy, which the
    # console cannot explain because the request never reaches a handler that
    # knows what a model is.
    client_max_body_size 96k;

    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The assistant's answer stream, and the only endpoint that needs its own block.
    #
    # The killer was proxy_read_timeout, which defaults to 60 s and counts silence rather
    # than elapsed time. A local model can hold the stream quiet for the better part of a
    # minute while it loads its weights and processes the prompt, and nginx closed a
    # connection that was merely thinking — the browser saw a stream that ended after
    # "thinking" with no error in it, which is the worst shape a failure can take because
    # nothing says anything went wrong.
    #
    # The api now sends a keepalive comment every 15 s, which by itself would keep this
    # timeout from firing on any proxy. This block is the second line of defence and it
    # exists for a different reason: the read timeout is set above the api's own
    # five-minute budget so that when an answer really does run out of time, the api is
    # the one that gives up and sends an SSE error frame the page can show. The component
    # that understands the request should be the one that ends it.
    #
    # proxy_buffering off is belt and braces, not the fix: nginx already honours the
    # X-Accel-Buffering header the api sends on this route.
    location = /api/v1/assistant/ask {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
        # How long nginx may spend writing to the browser. A stalled tab should be the
        # api's problem to notice, not a reason to tear down the upstream mid-answer.
        proxy_send_timeout 330s;
        add_header X-Accel-Buffering no;
    }

    location = /healthz {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
