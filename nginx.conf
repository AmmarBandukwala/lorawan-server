server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    # A device model carries a vendor payload formatter of up to 64 KiB, and the
    # api service allows 68 KiB for the surrounding JSON. A smaller limit here
    # would reject a legitimate formatter with a 413 from the proxy, which the
    # console cannot explain because the request never reaches a handler that
    # knows what a model is.
    client_max_body_size 96k;

    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
