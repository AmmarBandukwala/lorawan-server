# Fieldnode LoRaWAN stack.
#
# Three services and one database:
#
#   ns    the network server. It speaks the Semtech UDP protocol with gateways
#         directly, so no gateway bridge, MQTT broker or Redis is needed.
#   api   the dashboard's read API and device provisioning proxy.
#   web   the React console, behind nginx, which proxies /api to the api service.
#   db    PostgreSQL, shared by ns and api; each owns its own tables through its
#         own migration runner.
#
# Network segmentation: `backend` is internal, so nothing outside the compose
# project can reach the database or the api port. Only the gateway UDP port and
# the web port are published, and the web port is published on loopback by
# default.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldnode
      POSTGRES_USER: fieldnode
      # No default: a deployment that comes up with a known password because one
      # variable was forgotten is a deployment that gets breached.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnode -d fieldnode"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend

  ns:
    build:
      context: ./ns
    restart: unless-stopped
    environment:
      # Gateways reach this port. It is the packet forwarder's well-known port,
      # so a gateway needs no server_port change to find it.
      NS_LISTEN_ADDR: :6858
      NS_STATUS_ADDR: :8090
      NS_API_ADDR: :8091
      # The band the network runs on. Unset here means US915, which the network
      # server also falls back to; naming it explicitly in .env is still the
      # right move for a deployment, because the band is a regulatory setting
      # that should never be an accident.
      NS_REGION: ${NETWORK_REGION:-US915}
      NS_NET_ID: ${NETWORK_NET_ID:?Set NETWORK_NET_ID in .env to a 6-hex-digit NetID}
      NS_DATABASE_URL: postgres://fieldnode:${POSTGRES_PASSWORD}@db:5432/fieldnode?sslmode=disable
      NS_API_TOKEN: ${NS_API_TOKEN:?Set NS_API_TOKEN in .env (at least 16 characters)}
      NS_LOG_LEVEL: ${NS_LOG_LEVEL:-info}
      # LoRa Basics Station endpoints. Stations dial this port directly, so it
      # is published like the UDP one. NS_LBS_TOKEN is what stops any client
      # that can reach it from claiming to be a gateway: without it the server
      # still runs, but it logs a warning on every start because the trust has
      # to come from the network instead. Set NS_LBS_ADDR=off to close the
      # transport on a network that will never have a station.
      NS_LBS_ADDR: :30001
      NS_LBS_TOKEN: ${NS_LBS_TOKEN:-}
      NS_LBS_RADIO_PLAN: ${NS_LBS_RADIO_PLAN:-}
      NS_LBS_JOIN_EUIS: ${NS_LBS_JOIN_EUIS:-}
    ports:
      # The one mapping that must not default to loopback: gateways reach it from
      # the LAN. Set NS_GATEWAY_BIND_ADDRESS=127.0.0.1 to restrict it to a local
      # simulator.
      - "${NS_GATEWAY_BIND_ADDRESS:-0.0.0.0}:${NS_GATEWAY_PORT:-6858}:6858/udp"
      # Basics Station connects here over WebSocket. Reachable from the LAN for
      # the same reason as the UDP port, and restricted the same way with
      # NS_LBS_BIND_ADDRESS.
      - "${NS_LBS_BIND_ADDRESS:-0.0.0.0}:${NS_LBS_PORT:-30001}:30001"
      # Status and application API stay on loopback: they are for this host's
      # operator and for the api service on the internal network. Both are
      # published, because the operator's curl examples and the nsbench smoke run
      # talk to them by host port; neither is reachable from the LAN.
      - "127.0.0.1:${NS_STATUS_PORT:-8090}:8090"
      - "127.0.0.1:${NS_API_PORT:-8091}:8091"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The image is distroless, so the binary is its own probe.
      test: ["CMD", "/ns", "-healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      # backend for the database, ingress for the published ports. Both are needed:
      # `backend` is `internal: true`, and Docker will not publish a host port from
      # a container that sits only on an internal network. It does not reject the
      # combination either -- compose accepts the mapping, starts the container,
      # reports it healthy and binds nothing -- so the symptom is a gateway that
      # cannot reach 6858/udp on a stack whose port list claims 6858 is open. The
      # gateway and LNS ports are the reason this service exists, so this pair is
      # load-bearing, not tidiness.
      - backend
      - ingress

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fieldnode:${POSTGRES_PASSWORD}@db:5432/fieldnode?sslmode=disable
      HTTP_ADDR: :8080
      # Provisioning goes over the network server's own API rather than writing
      # its tables, so the ns stays the only thing that decides what a valid
      # device is. See api/internal/nsclient.
      NS_API_URL: http://ns:8091
      NS_API_TOKEN: ${NS_API_TOKEN}
      # Health is read from the ns's status port, not the API port: /status is
      # served there and is not behind the API token.
      NS_STATUS_URL: http://ns:8090
      # Where to look for an MCP listener, so the Agents page can report whether one
      # is answering instead of guessing.
      #
      # Empty by default, and deliberately so. The MCP service runs only under its own
      # compose profile, and pointing this at a container that was never started would
      # make the page say "configured, but not answering" about a deployment that
      # simply does not run one — which is the wrong remedy to send someone off with.
      # Set it in .env alongside MCP_AUTH_TOKEN when you do start the profile.
      MCP_URL: ${MCP_URL:-}
      # The assistant. Both are needed or neither: one without the other is refused
      # at startup rather than started half-wired, because a page with an assistant
      # panel that fails every question reads as a broken console.
      #
      # They also do nothing unless MCP_URL is set, since the listener is the only
      # thing the assistant can read. Without it the assistant stays off and says so,
      # rather than answering about a network it cannot see.
      #
      # The endpoint is reported to the page on purpose: the argument for a local
      # model is that nothing leaves the network, and that is only reassuring if the
      # page shows where the request went.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # The assistant authenticates to the listener with the same token the listener
      # was started with, so one variable and one rotation.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      ns:
        condition: service_healthy
    networks:
      - backend

  # The MCP server, which lets an agent interrogate the network. Off by default:
  # it only starts under `docker compose --profile mcp up`, because it is a door
  # into the network and nobody should get one by pulling the stack up.
  #
  # It is a third module with its own go.mod, and it holds no state: everything it
  # answers comes from the network server over the same API the console uses, so it
  # cannot disagree with the console about what a device is.
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    environment:
      # Both upstreams are the service names on the internal network. The status
      # URL is separate because /status is unauthenticated and served on its own
      # port; the client sends the API token only to the API.
      NS_API_URL: http://ns:8091
      NS_STATUS_URL: http://ns:8090
      NS_API_TOKEN: ${NS_API_TOKEN}
      # What this process may do. read is the default and offers no writes at all.
      # operate adds queueing, cancelling and reconfiguring a device that is
      # already provisioned. Creating a device, changing an integration and
      # installing a payload formatter are in no profile: see mcp/README.md.
      MCP_PROFILE: ${MCP_PROFILE:-read}
      # The listener. Without this the process serves MCP over stdio and the port
      # mapping below would connect to nothing, so it is set here rather than
      # exposed as a variable: inside the container the address is always this.
      MCP_HTTP_ADDR: :8092
      # Required with this profile, and deliberately NOT the same variable as
      # NS_API_TOKEN. One secret guarding both this listener and the network
      # server's API means one leak opens both, and neither can be rotated
      # without the other. The process refuses to start if the two are equal.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env to start the mcp profile}
      # debug | info | warn | error
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
    ports:
      # Loopback by default, like the status endpoint. The MCP endpoint speaks
      # plain HTTP and a bearer token over plain HTTP is readable by anyone on the
      # wire, so publishing this on 0.0.0.0 means putting TLS in front of it
      # first. Agents running on this host reach it at 127.0.0.1 without that.
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_HTTP_PORT:-8092}:8092"
    depends_on:
      ns:
        condition: service_healthy
    healthcheck:
      # The image is distroless, so the binary is its own probe.
      test: ["CMD", "/fieldnode-mcp", "-healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      # backend for the upstreams, ingress for the published port. Both are needed
      # and the second looks redundant until it is missing: `backend` is
      # `internal: true`, and Docker cannot publish a host port from a container
      # that sits only on an internal network. Compose does not reject that
      # combination -- it accepts the mapping, starts the container, reports it
      # healthy, and binds nothing, so the only symptom is a connection refused on
      # a port the config says is open. `web` carries the same pair for the same
      # reason.
      - backend
      - ingress

  # A local model for the assistant, so a question about the network stays on the
  # network.
  #
  # Off by default, like the listener, and for the same kind of reason: it pulls 4.7 GB
  # on first start and holds about 5.4 GB resident afterwards. Neither should happen
  # because someone ran `docker compose up`. To enable it:
  #
  #   docker compose --profile llm up -d
  #
  # and then point the console at it, which is the same pair of variables that turns
  # the assistant on at all:
  #
  #   LLM_BASE_URL=http://ollama:11434/v1
  #   LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
  #
  # Nothing else in the stack needs the published port — the console reaches this over
  # the internal network — so it is loopback like the other operator-facing endpoints.
  # It is there for a host-side agent that wants the same model the console uses.
  #
  # Two things to know before doing this on a Mac. Docker Desktop gives no GPU to a
  # container (`--gpus=all` fails with "no known GPU vendor found"), so inference is
  # CPU-only: roughly 55 tokens a second of prompt processing and 10 a second of
  # answer. The assistant's fixed prompt is about 5,000 tokens, so the first token of a
  # cold answer takes on the order of a minute and a half. And the whole Docker VM gets
  # whatever memory Docker Desktop is configured with — 8 GiB by default — of which this
  # takes about 5.4 GiB, leaving room for the rest of the stack but not a lot of it.
  # Raising the VM's memory in Docker Desktop's settings helps more than any setting here.
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # The context window the assistant's context budget is sized against. The console
      # sends no context parameter of its own, so this is the only place it can be set.
      # Below the fixed cost the runtime truncates the request rather than refusing it,
      # usually dropping the system turn, and the assistant then answers fluently
      # without calling a single tool — which reads as a weak model, not a small window.
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT_LENGTH:-16384}
    volumes:
      # The weights live here, not in an image layer: 4.7 GB baked into an image would
      # be re-downloaded by anyone who rebuilt the stack, and it is a model rather than
      # code. Deleting the volume is how you take the model off the machine.
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:${LLM_PORT:-11434}:11434"
    healthcheck:
      # `ollama list` has to reach the API to succeed, so this is a readiness probe
      # rather than a process-liveness one. The image carries no curl.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 20s
    networks:
      # backend for the console, ingress for the published port. Both, for the reason
      # documented twice above: `backend` is internal, and Docker will not publish a
      # host port from a container that sits only on it.
      - backend
      - ingress

  # One-shot: asks the server above to fetch the model, then exits.
  #
  # A separate service rather than an entrypoint wrapper around `ollama serve`, so the
  # server keeps its own startup path and its own logs, and a failed download shows up
  # as a container that exited non-zero instead of a server that reports healthy with
  # nothing in it and fails every question later.
  #
  # Deliberately nothing depends on this, including the console. The assistant is an
  # addition to a dashboard that is otherwise complete, and making the dashboard wait
  # on a 4.7 GB download would let an offline machine or a bad tag take the whole
  # console down — which is the failure the console's own startup checks are written to
  # avoid. The cost of that choice is that the first question after a cold start can
  # arrive before the model has finished; it fails, and asking again works.
  llm-model:
    profiles: ["llm"]
    image: ollama/ollama:latest
    # The CLI is a client of the server, so this container tells the running server to
    # fetch and writes nothing itself. It needs no volume.
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_BIND_ADDRESS:-127.0.0.1}:${WEB_HTTP_PORT:-8082}:80"
    depends_on:
      - api
    networks:
      - backend
      - ingress

volumes:
  postgres-data:
  ollama-data:

networks:
  backend:
    internal: true
  ingress:
    driver: bridge
